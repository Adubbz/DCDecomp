# The dun image, as splat splits it.
# Generated by scripts/build/splat_config.py; do not edit.
name: dun
sha1: ab7e56a4eeb69e178638088de6e57857d48f1d98
options:
  platform: ps2
  compiler: MWCCPS2
  basename: dun
  base_path: ..
  target_path: rom/extracted/iso/DUN.BIN
  asm_path: asm
  src_path: src
  build_path: build/splat/dun
  ld_script_path: build/splat/dun.ld
  symbol_addrs_path: [config/dun.symbols.txt]
  undefined_syms_auto_path: build/splat/dun.undefined_syms.txt
  undefined_funcs_auto_path: build/splat/dun.undefined_funcs.txt

  # The conventions the reference assembly has always been written in.
  mips_abi_gpr: numeric
  asm_data_macro: glabel
  asm_end_label: ""
  asm_data_end_label: ""
  asm_nonmatching_label_macro: ""
  rom_address_padding: True
  create_data_pads: False
  create_bss_pads: True

  # A wrong guess makes the build non-matching, so nothing is guessed.
  rodata_string_guesser_level: 0
  data_string_guesser_level: 0
  find_file_boundaries: False

  # A constant belongs to the function that uses it and travels with
  # it; what no function claims keeps a marker of its own.
  migrate_rodata_to_functions: True
  # Every reference file has to assemble on its own -- objdiff builds
  # each as the object it compares against, and tools/mwccgap
  # assembles the ones a marker names. A constant written to a file of
  # its own takes the preamble rather than the header, so both carry
  # macro.inc; including it twice is harmless.
  generated_s_preamble: ".include \"macro.inc\""
  asm_inc_header: ".include \"macro.inc\"\n\n.set noat\n.set noreorder\n\n"
  # Every source already exists; splat reads the markers out of them
  # to decide which functions still need reference assembly.
  create_c_files: False
  # include/macro.inc is written by hand and load-bearing: its `alabel`
  # is deliberately not global, because a branch to a global label
  # becomes a relocation mwld and gas disagree about. splat's generated
  # one makes it global, so it must not overwrite this project's.
  generate_asm_macros_files: False
  do_c_func_detection: True
  # A function still supplied by a marker gets a file of its own, for
  # tools/mwccgap to splice; a decompiled one gets a file under
  # asm/matchings, which is the only thing objdiff can compare it
  # against on its own. Neither applies to a whole-file asm unit --
  # those are one file and nothing else.
  disassemble_all: True
  make_full_disasm_for_code: True
  section_order: [".text", ".data", ".rodata", ".rdata", ".sdata", ".sbss", ".bss"]

segments:
  - name: dun
    type: code
    start: 0x0
    vram: 0x1dabd00
    bss_size: 0x142680
    subsegments:
      - {start: 0x0, type: bin, name: header, dir: dun}
      - {start: 0x40, type: asmtu, name: dun/gameloop}
      - {start: 0x15e00, type: data, name: data, dir: dun}
      - {start: 0x18714, type: bin, name: dun_pad}
      - {start: 0x18780, type: bss, name: bss, vram: 0x1dc4414, dir: dun}
  - [0x18780]
